name: Browser renderer comparison
on: [push]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, backend: chromium }
          - { os: ubuntu-latest, backend: mesa }
          - { os: windows-latest, backend: warp }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Measure actual table
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          pnpm dev > vite.log 2>&1 &
          for i in {1..40}; do curl -fsS http://localhost:4173/ >/dev/null && break; sleep 1; done
          if [ "$BACKEND" = mesa ]; then
            export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
            xvfb-run -a node scripts/ci-renderer-comparison.mjs
          else
            node scripts/ci-renderer-comparison.mjs
          fi
