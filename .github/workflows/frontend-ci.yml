name: Frontend CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build website, offline APK and update package
        id: mobile
        env:
          KEY_BASE64: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.YINZHOU_KEYSTORE_BASE64 || '' }}
          YINZHOU_KEY_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.YINZHOU_KEY_PASSWORD || '' }}
        run: |
          if [ -n "$KEY_BASE64" ]; then
            export YINZHOU_KEYSTORE="$RUNNER_TEMP/yinzhou.p12"
            install -m 600 /dev/null "$YINZHOU_KEYSTORE"
            printf '%s' "$KEY_BASE64" | base64 --decode > "$YINZHOU_KEYSTORE"
            unset KEY_BASE64
            echo 'distribution=true' >> "$GITHUB_OUTPUT"
          else
            # Build verification only. Never distribute an APK signed with a temporary identity.
            pnpm android:signing-init
          fi
          pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: steps.mobile.outputs.distribution == 'true'
        with:
          name: yinzhou-site-and-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
